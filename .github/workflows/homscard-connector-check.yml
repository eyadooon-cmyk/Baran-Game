name: HomsCard connector checks

on:
  pull_request:
    paths:
      - "supabase/functions/baran-homscard-connector/**"
      - "supabase/functions/baran-order-gateway/**"
      - "baran-homscard-instant-apps.js"
      - "baran-homscard-instant-apps.css"
      - "supabase/migrations/*homscard*"
      - "tests/homscard-connector.test.mjs"
      - "tests/homscard-analysis.test.mjs"
      - "tests/homscard-fixed-checkout.test.mjs"
      - "tests/homscard-fixed-transaction-simulation.test.mjs"
      - "tests/postgres/homscard-fixed-order.integration.sql"
      - "baran-homscard-fixed-checkout.js"
      - "baran-homscard-instant-apps-20261127-v3.js"
      - "homscard-analysis.js"
      - "homscard-intelligence.js"
      - "admin-operations.js"
      - "index.html"
      - ".github/workflows/homscard-connector-check.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/baran-homscard-connector/**"
      - "supabase/functions/baran-order-gateway/**"
      - "baran-homscard-instant-apps.js"
      - "baran-homscard-instant-apps.css"
      - "supabase/migrations/*homscard*"
      - "tests/homscard-connector.test.mjs"
      - "tests/homscard-analysis.test.mjs"
      - "tests/homscard-fixed-checkout.test.mjs"
      - "tests/homscard-fixed-transaction-simulation.test.mjs"
      - "tests/postgres/homscard-fixed-order.integration.sql"
      - "baran-homscard-fixed-checkout.js"
      - "baran-homscard-instant-apps-20261127-v3.js"
      - "homscard-analysis.js"
      - "homscard-intelligence.js"
      - "admin-operations.js"
      - "index.html"
      - ".github/workflows/homscard-connector-check.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baran_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run HomsCard safety and analysis tests
        run: node --test tests/homscard-connector.test.mjs tests/homscard-analysis.test.mjs
      - name: Run fixed and variable checkout contract tests
        run: node --test tests/homscard-fixed-checkout.test.mjs
      - name: Run isolated fixed-order transaction simulation
        run: node --test tests/homscard-fixed-transaction-simulation.test.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run actual fixed-order RPC against ephemeral PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d baran_test -v ON_ERROR_STOP=1 -f tests/postgres/homscard-fixed-order.integration.sql
      - uses: denoland/setup-deno@v2
      - name: Type-check HomsCard Edge Function
        run: |
          deno check supabase/functions/baran-homscard-connector/index.ts
          deno check supabase/functions/baran-order-gateway/index.ts
      - name: Check admin and intelligence JavaScript syntax
        run: |
          node --check admin-operations.js
          node --check homscard-analysis.js
          node --check homscard-intelligence.js
          node --check baran-homscard-instant-apps.js
          node --check baran-homscard-instant-apps-20261127-v3.js
          node --check baran-homscard-fixed-checkout.js
