name: Communication center checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'baran-guest-support*.js'
      - 'tests/guest-support-safety.test.mjs'
      - 'communication-center.js'
      - 'community.js'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/communication-center-check.yml'
  push:
    branches: [feature/communication-center-premium, feature/pro-support-ticket-center-20261125]
    paths:
      - 'index.html'
      - 'communication-center.js'
      - '.github/workflows/communication-center-check.yml'

jobs:
  communication-center:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript syntax
        run: |
          node --check communication-center.js
          node --check community.js
          node --check customer-center.js
          node --check baro.js
          node --check customer-experience-suite.js
          node --check baran-guest-support.js
          node --check baran-guest-support-admin.js
      - name: Run guest support safety tests
        run: node --test tests/guest-support-safety.test.mjs
      - name: Check support Edge Function syntax
        run: |
          deno check supabase/functions/baran-baro-manual/index.ts
          deno check supabase/functions/baran-support-center/index.ts
          deno check supabase/functions/baran-push-dispatch/index.ts
          deno check supabase/functions/baran-admin-offline/index.ts
          deno check supabase/functions/baran-admin/index.ts
          deno check supabase/functions/baran-guest-support/index.ts
          deno check supabase/functions/baran-auto-support-reply/index.ts
          deno check supabase/functions/baran-customer-center/index.ts
          deno check supabase/functions/baran-order-gateway/index.ts
          deno check supabase/functions/baran-shamcash-verify/index.ts
          deno check supabase/functions/baran-auth-security/index.ts
          deno check supabase/functions/baran-assistant/index.ts
          deno check supabase/functions/baran-push-register/index.ts
      - name: Check communication UI wiring
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const js = readFileSync('communication-center.js', 'utf8');
          const checks = [
            ['communication script is loaded', html.includes('./communication-center.js?v=20261117-unified-2')],
            ['notification cards expose their ID after creation', /const card=document\.createElement\("article"\);\s*card\.dataset\.notificationId/.test(html)],
            ['customer and admin notification lists are wired', js.includes('createToolbar("customerNotificationsList"') && js.includes('createToolbar("adminNotifications"')],
            ['bulk read uses the existing server RPC', js.includes('mark_baran_notifications_read')],
            ['quick replies are available for both support roles', js.includes('customerSupportConversationInput') && js.includes('adminSupportConversationInput')],
            ['notification preferences are connected', js.includes('baran_notification_preferences') && js.includes('quiet_hours_enabled')],
            ['support attachment upload is wired', readFileSync('community.js', 'utf8').includes('baran-support-attachments')],
            ['ticket priority and assignment controls are wired', readFileSync('community.js', 'utf8').includes('adminSupportConversationAssignee')],
            ['existing broadcast form is not duplicated', (html.match(/id="baranAnnouncementTitle"/g)||[]).length === 1],
            ['unified communication center has three sections', js.includes('BARAN COMMUNICATION CENTER') && js.includes('createPane("notifications"') && js.includes('createPane("messages"') && js.includes('createPane("assistant"')],
            ['unified center reuses existing live components', js.includes('move(auto,assistantPane.pane)') && js.includes('move(assistant,assistantPane.pane)') && js.includes('adminPanel.querySelector(\".announcement-panel\")')],
            ['broadcast is grouped inside a collapsed communication-center section', js.includes('bcc-announcements') && js.includes('notificationContent.appendChild(announcementDetails)')],
            ['support inbox has a helpful empty state', html.includes('support-empty-state') && html.includes('صندوق الدعم فارغ حالياً')],
            ['guest and registered-customer tickets share one support workspace', html.includes('supportTabGuests') && html.includes('supportGuestView') && html.includes('id="baranGuestAdminMount"') && html.includes("switchSupportTab('guests')")],
            ['guest inbox loads only when its unified support tab is selected', html.includes('selected==="guests"') && html.includes('loadBaranGuestSupportAdmin')],
            ['support priority filter has no visible escaped newline', !html.includes('</select>\\n                  <label for=\"adminFeedbackPriorityFilter\">')],
            ['embedded broadcast is excluded from duplicate section navigation', html.includes('announcement-panel')],
            ['communication report routes through read-only admin analysis', js.includes('أنشئ تقريراً إدارياً عن التواصل') && js.includes('ولا تنفذ أي إجراء أو تغيير')],
            ['notification preference migration exists', readFileSync('supabase/migrations/20261117190000_add_notification_preferences.sql', 'utf8').includes('baran_notification_preferences')],
            ['support attachment migration exists', readFileSync('supabase/migrations/20261117183000_enhance_baran_support_attachments_receipts.sql', 'utf8').includes('baran-support-attachments')],
            ['customer center script is loaded', html.includes('./customer-center.js?v=20261119-customer-center-session-ui')],
            ['customer center sends authenticated heartbeat and admin dashboard requests', readFileSync('customer-center.js', 'utf8').includes('sendPresence("heartbeat")') && readFileSync('customer-center.js', 'utf8').includes('action: "dashboard"')],
            ['customer presence endpoint enforces admin access for dashboard', readFileSync('supabase/functions/baran-customer-center/index.ts', 'utf8').includes('admin_is_user') && readFileSync('supabase/functions/baran-customer-center/index.ts', 'utf8').includes('Administrator access required')],
            ['presence migration keeps rows server-only', readFileSync('supabase/migrations/20261117220000_customer_presence_tracking.sql', 'utf8').toLowerCase().includes('enable row level security') && readFileSync('supabase/migrations/20261117220000_customer_presence_tracking.sql', 'utf8').toLowerCase().includes('revoke all on table public.customer_presence from anon, authenticated')],
            ['customer and failed-order admin alert triggers exist', readFileSync('supabase/migrations/20261117221000_customer_center_admin_alerts.sql', 'utf8').includes('trg_notify_admin_customer_registered') && readFileSync('supabase/migrations/20261117221000_customer_center_admin_alerts.sql', 'utf8').includes('trg_notify_admin_order_failed')],
            ['customer directory exposes order totals and last activity', readFileSync('supabase/functions/baran-admin/index.ts', 'utf8').includes('lifetime_spend_usd') && readFileSync('supabase/functions/baran-admin/index.ts', 'utf8').includes('last_order_at')],
            ['signup accepts an optional referral code', html.includes('id="signupReferralCode"') && html.includes('referral_code:referralCode')],
            ['referral tracking is server-only', readFileSync('supabase/migrations/20261117222000_customer_referral_tracking.sql', 'utf8').toLowerCase().includes('enable row level security') && readFileSync('supabase/migrations/20261117222000_customer_referral_tracking.sql', 'utf8').toLowerCase().includes('revoke all on table public.customer_referrals from anon, authenticated')],
            ['first completed order qualifies a referral', readFileSync('supabase/migrations/20261117222000_customer_referral_tracking.sql', 'utf8').includes('qualify_customer_referral_on_first_completed_order')],
            ['customer center displays referral tracking', readFileSync('customer-center.js', 'utf8').includes('renderReferrals(result)') && readFileSync('supabase/functions/baran-customer-center/index.ts', 'utf8').includes('customer_referrals')],
            ['customer center displays last-seen history', readFileSync('customer-center.js', 'utf8').includes('renderRecentCustomers(result.recent || [])') && readFileSync('supabase/functions/baran-customer-center/index.ts', 'utf8').includes('is_online: new Date(row.last_seen_at)')],
            ['ban guard is enforced on customer center and support routes', readFileSync('supabase/functions/baran-customer-center/index.ts', 'utf8').includes('customer_account_controls') && readFileSync('supabase/functions/baran-support-center/index.ts', 'utf8').includes('customer_account_controls')],
            ['ban guard is enforced on BARO, ShamCash and order preflight', readFileSync('supabase/functions/baran-baro-manual/index.ts', 'utf8').includes('customer_account_controls') && readFileSync('supabase/functions/baran-shamcash-verify/index.ts', 'utf8').includes('customer_account_controls') && readFileSync('supabase/functions/baran-order-gateway/index.ts', 'utf8').includes('customer_account_controls')],
            ['ban guard covers AI assistant and push registration', readFileSync('supabase/functions/baran-assistant/index.ts', 'utf8').includes('customer_account_controls') && readFileSync('supabase/functions/baran-push-register/index.ts', 'utf8').includes('customer_account_controls')],
            ['database blocks banned users across customer write tables', readFileSync('supabase/migrations/20261117223000_customer_security_enforcement.sql', 'utf8').includes('block_banned_customer_orders') && readFileSync('supabase/migrations/20261117223000_customer_security_enforcement.sql', 'utf8').includes('block_banned_customer_wallets')],
            ['new-device events are captured from real Supabase sessions', readFileSync('supabase/migrations/20261117223000_customer_security_enforcement.sql', 'utf8').includes('after insert on auth.sessions') && readFileSync('supabase/migrations/20261117223000_customer_security_enforcement.sql', 'utf8').includes('customer_new_device_detected')],
            ['failed login reports are rate-limited and marked unverified', readFileSync('supabase/migrations/20261117223000_customer_security_enforcement.sql', 'utf8').includes('baran_record_login_failure') && readFileSync('supabase/migrations/20261117223000_customer_security_enforcement.sql', 'utf8').includes('verified_by_auth_server')],
            ['login form hashes the email and never sends the password to telemetry', html.includes('reportFailedLogin(email)') && html.includes('identifier_hash:identifierHash') && !/reportFailedLogin\([^)]*password/.test(html)],
            ['admin customer profile includes security monitoring', readFileSync('customer-experience-suite.js', 'utf8').includes('مراقبة الدخول والأجهزة') && readFileSync('supabase/functions/baran-admin/index.ts', 'utf8').includes('customer_security_events')],
            ['customer experience bundle cache version is refreshed', html.includes('./customer-experience-suite.js?v=20261119-customer-experience-separated-v2')],
            ['customer directory shows member ID instead of email in cards', html.includes('ID: "+(item.member_code||"غير متوفر")') && !html.includes('subtitle.textContent=item.email||item.member_code')],
            ['customer directory status filter is wired', html.includes('opsCustomerStatusFilter') && html.includes('statusOf(item)')],
            ['customer directory includes copy-ID actions and last activity', html.includes('copyCustomerMemberCode(item.member_code') && html.includes('last_activity_at||item.last_sign_in_at||item.last_order_at')],
            ['private customer admin notes are stored behind RLS', readFileSync('supabase/migrations/20261119172716_customer_admin_notes_20261119.sql', 'utf8').includes('enable row level security') && readFileSync('supabase/migrations/20261119172716_customer_admin_notes_20261119.sql', 'utf8').includes('revoke all on table public.customer_admin_notes from public, anon, authenticated')],
            ['admin notes API is validated and audited', readFileSync('supabase/functions/baran-admin/index.ts', 'utf8').includes('customer_admin_note_update') && readFileSync('supabase/functions/baran-admin/index.ts', 'utf8').includes('customer_admin_notes')],
            ['admin notes request type is declared for Deno', readFileSync('supabase/functions/baran-admin/index.ts', 'utf8').includes('note?: string;')],
            ['customer profile includes private admin notes and copy ID', readFileSync('customer-experience-suite.js', 'utf8').includes('ملاحظات إدارية خاصة') && readFileSync('customer-experience-suite.js', 'utf8').includes('نسخ ID')],
            ['customer segment counter uses matching canonical keys and guards unknown labels', readFileSync('customer-experience-suite.js', 'utf8').includes('"جديد": 0') && readFileSync('customer-experience-suite.js', 'utf8').includes('hasOwnProperty.call(segments, segment)')],
            ['full customer profile button is visible outside the collapsed detail area', readFileSync('customer-experience-suite.js', 'utf8').includes('card.append(button)') && !readFileSync('customer-experience-suite.js', 'utf8').includes('details.append(button)')],
            ['customer classification is rendered only once in the experience suite', !readFileSync('customer-center.js', 'utf8').includes('baranCustomerSegments') && readFileSync('customer-experience-suite.js', 'utf8').includes('شرائح العملاء')],
          ];
          for (const [label, ok] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + label);
            if (!ok) process.exitCode = 1;
          }
          NODE
